apiVersion: apps/v1
kind: Deployment
metadata:
  name: sird-ocr-test
  namespace: sird-ocr-test
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kserve-wrk-gpu-1
