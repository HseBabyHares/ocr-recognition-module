[project]
name = "sird-verification"
version = "0.1.0"
description = "Focused executable contract and architecture oracles for SIRD"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sird_verification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src", "../integration/src"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8", "SQLAlchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "aio-pika>=9.5,<10.0"]

[tool.ruff]
target-version = "py314"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
