name: FADD delivery gates

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadd-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", package-manager-cache: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Install pinned OpenSpec when enabled
        if: ${{ hashFiles('openspec/**/*') != '' }}
        # pinned version, install scripts disabled
        run: npm install --no-save --no-package-lock --ignore-scripts @fission-ai/openspec@1.13.1 # zizmor: ignore[adhoc-packages]
      - run: node tools/harness/checks/run-all.mjs

  meta:
    name: CI and harness meta-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Install pinned meta toolchain
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 tools/meta/install.py --prefix "$RUNNER_TEMP/fadd-meta"
          echo "$RUNNER_TEMP/fadd-meta/bin" >> "$GITHUB_PATH"
      - run: tools/meta/lint.sh .

  security:
    name: real security scanners
    runs-on: ubuntu-latest
    steps:
      # runner context is not allowed in job-level env
      - run: echo "SECURITY_CACHE_DIR=$RUNNER_TEMP/omp-fadd-security-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SECURITY_CACHE_DIR }}
          key: fadd-security-db-${{ runner.os }}-${{ hashFiles('tools/security/toolchain.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            fadd-security-db-${{ runner.os }}-${{ hashFiles('tools/security/toolchain.lock.json') }}-
      - name: Install pinned scanners
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 tools/security/install.py --prefix "$RUNNER_TEMP/fadd-security"
          echo "$RUNNER_TEMP/fadd-security/bin" >> "$GITHUB_PATH"
      - name: Run fail-closed scanner orchestration
        run: python3 tools/security/scan.py --repo . --out artifacts/security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: fadd-security-reports, path: artifacts/security, if-no-files-found: error}

  quality:
    name: python quality ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Detect activated Python policy
        id: policy
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('quality/python-policy.json')
          active=p.exists() and json.loads(p.read_text()).get('status')=='active'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'active={str(active).lower()}\n')
          PY
      - name: Install pinned Python quality toolchain
        if: steps.policy.outputs.active == 'true'
        run: |
          python3 tools/quality/install.py --prefix "$RUNNER_TEMP/fadd-quality"
          echo "$RUNNER_TEMP/fadd-quality/bin" >> "$GITHUB_PATH"
      - name: Run strict active policy
        if: steps.policy.outputs.active == 'true'
        env: {BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before }}"}
        run: python3 tools/quality/run.py --repo . --out artifacts/quality
      - name: Record unconfigured policy without false verdict
        if: steps.policy.outputs.active != 'true'
        run: python3 tools/quality/run.py --repo . --out artifacts/quality --advisory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: fadd-quality-reports, path: artifacts/quality, if-no-files-found: error}

  architecture:
    name: architecture DFD STRIDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Detect activated architecture policy
        id: policy
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('architecture/policy.json')
          active=p.exists() and json.loads(p.read_text()).get('status')=='active'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'active={str(active).lower()}\n')
          PY
      - name: Resolve comparison base
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          # zero SHA on a new branch, unfetched SHA after a force push
          git cat-file -e "${base:-0}^{commit}" 2>/dev/null || base=HEAD^
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Validate architecture and threat evidence
        env:
          MODE: ${{ steps.policy.outputs.active == 'true' && 'strict' || 'advisory' }}
          BASE: ${{ steps.range.outputs.base }}
        run: >-
          python3 tools/architecture/validate.py
          --repo .
          --mode "$MODE"
          --base "$BASE"
          --head "$GITHUB_SHA"
          --out artifacts/architecture/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: fadd-architecture-reports, path: artifacts/architecture, if-no-files-found: error}

  container:
    name: container delivery policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Detect activated container policy
        id: policy
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('container/policy.json')
          active=p.exists() and json.loads(p.read_text()).get('status')=='active'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'active={str(active).lower()}\n')
          PY
      - name: Install pinned image-analysis tools
        if: steps.policy.outputs.active == 'true'
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 tools/container/install.py --prefix "$RUNNER_TEMP/fadd-container"
          python3 tools/security/install.py --prefix "$RUNNER_TEMP/fadd-security" --tool trivy
          echo "$RUNNER_TEMP/fadd-container/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/fadd-security/bin" >> "$GITHUB_PATH"
      - name: Run strict active image policy
        if: steps.policy.outputs.active == 'true'
        run: python3 tools/container/check.py --repo . --out artifacts/container
      - name: Record unconfigured image policy without false verdict
        if: steps.policy.outputs.active != 'true'
        run: python3 tools/container/check.py --repo . --out artifacts/container --advisory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: fadd-container-reports, path: artifacts/container, if-no-files-found: error}

  garbage-collector:
    name: entropy inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", package-manager-cache: false}
      - run: node tools/gc/run.mjs --repo . --out artifacts/gc --fail-on none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: fadd-gc-inventory, path: artifacts/gc, if-no-files-found: error}

  required-gate:
    name: FADD / required-gate
    if: always()
    needs: [deterministic, meta, security, quality, architecture, container, garbage-collector]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        env: {RESULTS: "${{ toJson(needs) }}"}
        run: |
          python3 - <<'PY'
          import json, os
          needs=json.loads(os.environ['RESULTS'])
          results={name:data.get('result') for name,data in needs.items()}
          bad={name:status for name,status in results.items() if status!='success'}
          print(json.dumps({'status':'fail' if bad else 'pass','jobs':results,'failures':bad},indent=2))
          raise SystemExit(1 if bad else 0)
          PY
