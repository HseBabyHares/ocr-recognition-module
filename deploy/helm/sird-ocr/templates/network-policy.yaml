{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sird-ocr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sird-ocr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sird-ocr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: grpc
          protocol: TCP
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
