replicaCount: 1

image:
  repository: sird-ocr
  tag: local
  digest: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 50051

server:
  maxWorkers: 4
  # Only accepted processing_policy.input_policy_id; empty accepts any.
  policyId: snils-card-input

# Must equal CAPABILITY_ISSUER / CAPABILITY_AUDIENCE of sird-process-service.
capability:
  issuer: process-service
  audience: ocr.service

storage:
  endpoint: ""
  bucket: sird-private
  region: us-east-1

# Secret with CAPABILITY_KEYS (kid:hex[,kid:hex]), S3_ACCESS_KEY and
# S3_SECRET_KEY. The chart never creates it.
existingSecret: ""

# Secret with tls.crt, tls.key and ca.crt (client CA). Empty serves
# plaintext gRPC; Process then needs OCR_PLAINTEXT=true.
tls:
  secretName: ""

tessdata:
  implementationSha256: 74b76a5b994adcc18be362bf64ed5118082b2401d5d9a35242e92fc4c62e2b4b
  dataSha256: 60bdf3940a7c6055937249931ba82cb1c06b70b0cc4d243a3f1b25c966641b5a

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 1Gi

tmp:
  sizeLimit: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

probes:
  startup:
    failureThreshold: 12
    periodSeconds: 5
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20

networkPolicy:
  enabled: true
  # Peers allowed to call the gRPC port.
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sird-process-service
  # DNS and the object store only.
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 9000
          protocol: TCP
