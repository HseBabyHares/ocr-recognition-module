[project]
name = "sird-workflow"
version = "0.1.0"
description = "Durable SIRD task submission and retrieval workflow"
requires-python = ">=3.14"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "aio-pika>=9.5,<10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sird_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
root = ["src", "tests"]
