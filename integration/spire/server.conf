server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/server/api.sock"
    trust_domain = "sird.example"
    data_dir = "/var/lib/spire/server"
    log_level = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "/run/spire/upstream/upstream-ca.key"
            cert_file_path = "/run/spire/upstream/upstream-ca.crt"
        }
    }
}
