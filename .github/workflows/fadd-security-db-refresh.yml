name: FADD weekly security databases

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/security/toolchain.lock.json", "tools/security/refresh-databases.sh"]

permissions:
  contents: read

concurrency:
  group: fadd-security-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # runner context is not allowed in job-level env
      - run: echo "SECURITY_CACHE_DIR=$RUNNER_TEMP/omp-fadd-security-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - name: Derive weekly cache key
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SECURITY_CACHE_DIR }}
          key: fadd-security-db-${{ runner.os }}-${{ hashFiles('tools/security/toolchain.lock.json') }}-${{ steps.week.outputs.value }}
          restore-keys: fadd-security-db-${{ runner.os }}-${{ hashFiles('tools/security/toolchain.lock.json') }}-
      - name: Install pinned scanners
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 tools/security/install.py --prefix "$RUNNER_TEMP/fadd-security"
          echo "$RUNNER_TEMP/fadd-security/bin" >> "$GITHUB_PATH"
      - run: tools/security/refresh-databases.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fadd-security-db-metadata
          path: ${{ env.SECURITY_CACHE_DIR }}/metadata.json
          if-no-files-found: error
