[project]
name = "sird-experiment"
version = "0.1.0"
description = "Isolated deterministic SIRD experiment runner and evaluator"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sird_experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
