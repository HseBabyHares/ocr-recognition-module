[project]
name = "sird-test-app"
version = "0.1.0"
description = "Test-only HTTP adapter for SIRD recognition"
requires-python = ">=3.14"
dependencies = [
    "granian>=2.8.3",
    "litestar>=2.24.0",
    "sird-recognition",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[tool.uv.sources]
sird-recognition = { path = "..", editable = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sird_test_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]

[tool.ruff]
target-version = "py313"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
