apiVersion: v1
kind: Service
metadata:
  name: {{ include "sird-ocr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sird-ocr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sird-ocr.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
