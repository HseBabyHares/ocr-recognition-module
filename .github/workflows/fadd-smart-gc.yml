name: FADD smart garbage collector

on:
  schedule:
    - cron: "43 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadd-gc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: smart garbage collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", package-manager-cache: false}
      - run: node tools/gc/run.mjs --repo . --out artifacts/gc --fail-on none
      - run: node tools/gc/promote.mjs artifacts/gc/inventory.json quality/gc-history.json artifacts/gc/proposals tools/gc/policy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: fadd-smart-gc, path: artifacts/gc, if-no-files-found: error}
